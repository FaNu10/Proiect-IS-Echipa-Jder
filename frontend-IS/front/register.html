<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register - LittleLoop</title>

    <link rel="stylesheet" href="../css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- REGISTER PAGE -->

    <section class="login-page">
      <!-- LEFT SIDE -->

      <div class="login-left">
        <div class="login-overlay">
          <h1>LittleLoop</h1>

          <p>
            Join our community of conscious fashion lovers and give clothes a
            second life.
          </p>
        </div>
      </div>

      <!-- RIGHT SIDE -->

      <div class="login-right">
        <div class="login-box">
          <h2>Create an account</h2>

          <p class="login-subtitle">Start your sustainable journey</p>

          <!-- FORM -->

          <form class="register-form" novalidate>

            <div class="input-group">
              <label for="reg-name">Full Name</label>
              <input
                type="text"
                id="reg-name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                aria-describedby="reg-name-error"
              />
              <span class="field-error" id="reg-name-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="input-group">
              <label for="reg-email">Email Address</label>
              <input
                type="email"
                id="reg-email"
                placeholder="Enter your email"
                autocomplete="email"
                aria-describedby="reg-email-error"
              />
              <span class="field-error" id="reg-email-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="input-group">
              <label for="reg-password">Password</label>
              <input
                type="password"
                id="reg-password"
                placeholder="Create a password (min 8 chars)"
                autocomplete="new-password"
                aria-describedby="reg-password-error"
              />
              <span class="field-error" id="reg-password-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="input-group">
              <label for="reg-confirm">Confirm Password</label>
              <input
                type="password"
                id="reg-confirm"
                placeholder="Repeat your password"
                autocomplete="new-password"
                aria-describedby="reg-confirm-error"
              />
              <span class="field-error" id="reg-confirm-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="checkbox-group">
              <input type="checkbox" id="reg-terms" />
              <span>I agree to the <a href="#">Terms of Service</a></span>
            </div>
            <span class="field-error" id="reg-terms-error" role="alert" aria-live="polite"></span>

            <p class="auth-error" id="reg-error" role="alert" aria-live="assertive"></p>

            <button type="submit" class="login-main-btn" id="reg-btn">Register →</button>

          </form>

          <!-- LOGIN LINK -->

          <div class="register-link">
            <p>
              Already have an account?
              <a href="login.html"> Sign in </a>
            </p>
          </div>

          <!-- COMMUNITY -->

          <div class="community-users">
            <div class="avatars">
              <img src="https://randomuser.me/api/portraits/women/44.jpg" />
              <img src="https://randomuser.me/api/portraits/men/32.jpg" />
              <img src="https://randomuser.me/api/portraits/women/68.jpg" />
            </div>

            <p>Joined by 12k+ sustainable shoppers</p>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="../js/app.js"></script>
  </body>
</html>
