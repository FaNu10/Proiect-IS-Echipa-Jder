version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: littleloop_db
    restart: always
    environment:
      POSTGRES_USER: littleloop
      POSTGRES_PASSWORD: littleloop123
      POSTGRES_DB: littleloop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: littleloop_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@littleloop.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
